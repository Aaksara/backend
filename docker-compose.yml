services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://aksara:aksara@db:5432/aksara
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aksara
      POSTGRES_PASSWORD: aksara
      POSTGRES_DB: aksara
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aksara -d aksara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
  media:
