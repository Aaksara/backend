<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif">
	<title>Passing a textbook on to another student</title>
	<rect width="1600" height="1100" fill="#E4F0F6"/>
	<circle cx="800" cy="520" r="400" fill="#D0E4EF"/>

	<!-- Circular "pass it on" arrows -->
	<g fill="none" stroke="#3B7EA1" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34">
		<path d="M470 360 A360 360 0 0 1 1130 360"/>
		<path d="M1130 700 A360 360 0 0 1 470 700"/>
	</g>
	<path d="M1110 320 l52 28 l-50 34 z" fill="#3B7EA1"/>
	<path d="M490 740 l-52 -28 l50 -34 z" fill="#3B7EA1"/>

	<!-- Left arm (giver) -->
	<g>
		<path d="M-40 640 L520 520 L540 620 L-20 760 Z" fill="#003262"/>
		<rect x="500" y="500" width="70" height="140" rx="20" transform="rotate(-12 535 570)" fill="#FDB515"/>
		<ellipse cx="610" cy="560" rx="78" ry="62" fill="#E9B48A"/>
		<rect x="600" y="500" width="70" height="32" rx="16" fill="#E9B48A"/>
	</g>

	<!-- Right arm (receiver) -->
	<g>
		<path d="M1640 640 L1080 520 L1060 620 L1620 760 Z" fill="#3B7EA1"/>
		<rect x="1030" y="500" width="70" height="140" rx="20" transform="rotate(12 1065 570)" fill="#FFFFFF"/>
		<ellipse cx="990" cy="560" rx="78" ry="62" fill="#8D5A3B"/>
		<rect x="930" y="500" width="70" height="32" rx="16" fill="#8D5A3B"/>
	</g>

	<!-- Book being handed over -->
	<g transform="translate(800 470) rotate(-6)">
		<rect x="-190" y="-130" width="380" height="260" rx="18" fill="#003262"/>
		<rect x="-170" y="-110" width="340" height="230" rx="8" fill="#F7F3EA"/>
		<rect x="-190" y="-130" width="380" height="240" rx="18" fill="#003262"/>
		<rect x="-190" y="-60" width="380" height="18" fill="#FDB515"/>
		<rect x="-120" y="-8" width="240" height="18" rx="9" fill="#FFFFFF" opacity=".85"/>
		<rect x="-80" y="26" width="160" height="12" rx="6" fill="#FFFFFF" opacity=".5"/>
	</g>

	<!-- Graduation cap -->
	<g transform="translate(800 150)">
		<path d="M-170 0 L0 -70 L170 0 L0 70 Z" fill="#22272A"/>
		<path d="M-100 30 v70 c0 40 200 40 200 0 v-70 L0 70 Z" fill="#003262"/>
		<path d="M130 16 v90" stroke="#FDB515" stroke-width="8"/>
		<circle cx="130" cy="114" r="14" fill="#FDB515"/>
		<circle r="12" fill="#FDB515"/>
	</g>

	<!-- Hearts -->
	<g fill="#FDB515">
		<path d="M350 230 c-20 -30 -70 -10 -50 30 l50 50 l50 -50 c20 -40 -30 -60 -50 -30 z"/>
		<path d="M1260 860 c-14 -22 -50 -8 -36 22 l36 36 l36 -36 c14 -30 -22 -44 -36 -22 z"/>
	</g>
</svg>
