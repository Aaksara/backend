<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif">
	<title>A verified university student ID</title>
	<rect width="1600" height="1100" fill="#E7EEF7"/>
	<circle cx="1150" cy="480" r="340" fill="#D6E3F1"/>
	<g fill="#C9D8E8">
		<circle cx="200" cy="200" r="10"/><circle cx="260" cy="200" r="10"/><circle cx="320" cy="200" r="10"/>
		<circle cx="200" cy="260" r="10"/><circle cx="260" cy="260" r="10"/><circle cx="320" cy="260" r="10"/>
		<circle cx="1300" cy="880" r="10"/><circle cx="1360" cy="880" r="10"/><circle cx="1420" cy="880" r="10"/>
	</g>

	<!-- Student ID card -->
	<g transform="translate(150 300) rotate(-6)">
		<rect x="10" y="20" width="700" height="440" rx="36" fill="#000" opacity=".1"/>
		<rect width="700" height="440" rx="36" fill="#FFFFFF"/>
		<path d="M0 36 a36 36 0 0 1 36 -36 h628 a36 36 0 0 1 36 36 v74 h-700 z" fill="#003262"/>
		<text x="40" y="70" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="3">STUDENT ID</text>
		<circle cx="640" cy="56" r="26" fill="#FDB515"/>

		<rect x="40" y="150" width="200" height="240" rx="20" fill="#DCE7F2"/>
		<circle cx="140" cy="240" r="50" fill="#8D5A3B"/>
		<path d="M60 390 v-30 a80 70 0 0 1 160 0 v30 z" fill="#3B7EA1"/>

		<rect x="280" y="170" width="260" height="28" rx="14" fill="#003262"/>
		<rect x="280" y="220" width="190" height="18" rx="9" fill="#9AA9B8"/>
		<rect x="280" y="290" width="340" height="56" rx="28" fill="#EEF3F8"/>
		<text x="306" y="328" font-size="28" font-weight="700" fill="#003262">maya@campus.edu</text>
		<rect x="280" y="366" width="130" height="16" rx="8" fill="#C3CFDB"/>
	</g>

	<!-- Verified shield -->
	<g transform="translate(1180 470)">
		<path d="M0 -260 L210 -180 V0 C210 150 110 240 0 290 C-110 240 -210 150 -210 0 V-180 Z" fill="#FDB515" stroke="#FFFFFF" stroke-width="14"/>
		<path d="M0 -200 L150 -142 V0 C150 110 80 180 0 220 C-80 180 -150 110 -150 0 V-142 Z" fill="#003262"/>
		<path d="M-70 10 l50 50 l100 -110" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<!-- Envelope with verification link -->
	<g transform="translate(1320 140) rotate(10)">
		<rect width="200" height="140" rx="16" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="6"/>
		<path d="M10 14 L100 84 L190 14" fill="none" stroke="#3B7EA1" stroke-width="6" stroke-linejoin="round"/>
		<circle cx="190" cy="10" r="28" fill="#2E9E6A"/>
		<path d="M178 10 l8 8 l16 -16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
	</g>
</svg>
